# Pousser un tag vX.Y.Z (scripts/release.sh) construit AudioPlayer pour macOS, Windows et
# Linux, chacun séparément, puis publie la Release GitHub vX.Y.Z avec les trois fichiers que
# lit la mise à jour intégrée à l'app : AudioPlayer-X.Y.Z.pkg, AudioPlayer-X.Y.Z-x64.exe,
# AudioPlayer-X.Y.Z-x86_64.AppImage. La Release n'est créée qu'une fois les trois builds
# réussis : une app ne voit jamais une version sans le fichier de son système.
name: Release

on:
  push:
    tags: ["v*"]

# Lecture seule par défaut ; seule la publication écrit (création de la Release).
permissions:
  contents: read

jobs:
  # Avant de compiler : le tag doit être la version de Cargo.toml, affichée par l'app.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME but Cargo.toml says $version"
            exit 1
          fi

  macos:
    needs: version
    uses: ./.github/workflows/build-macos.yml
  windows:
    needs: version
    uses: ./.github/workflows/build-windows.yml
  linux:
    needs: version
    uses: ./.github/workflows/build-linux.yml

  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AudioPlayer-*
          path: parts
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv parts/AudioPlayer.exe "parts/AudioPlayer-$version-x64.exe"
          ls -l parts
          gh release create "$GITHUB_REF_NAME" parts/* --repo "$GITHUB_REPOSITORY" \
            --title "AudioPlayer $version" --generate-notes --verify-tag
