[workspace]
resolver = "2"
members = ["crates/app", "crates/db", "crates/audio", "crates/scanner"]
# `cargo run` lance l'app ; `--workspace` pour construire ou tester tout le reste.
default-members = ["crates/app"]

[workspace.package]
version = "0.1.1"
edition = "2021"

[workspace.dependencies]
# Rendu Skia plutôt que femtovg : texte nettement plus fin (crénage, lissage).
# unstable-winit-030 : accès à la fenêtre winit pour déplacer le mini-lecteur sans cadre.
slint = { version = "1.18", default-features = false, features = ["std", "backend-default", "renderer-skia", "accessibility", "compat-1-2", "unstable-winit-030"] }
slint-build = "1.18"
rusqlite = { version = "0.41", features = ["bundled"] }
base64 = "0.23"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
souvlaki = "0.9"
# Mises à jour depuis les Releases GitHub : HTTPS (rustls), empreinte SHA-256, exe Windows remplacé en place.
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
self-replace = "1"
lofty = "0.25"
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-all"] }

# Les dépendances (décodage d'images, SQLite, rendu) restent optimisées même en debug.
[profile.dev.package."*"]
opt-level = 3

# Correctifs locaux (inertie du défilement de Slint, `block` pour une future version de Rust) ; voir vendor/README.md.
[patch.crates-io]
i-slint-core = { path = "vendor/i-slint-core" }
block = { path = "vendor/block" }
